name: Financial correctness

on:
  pull_request:
  push:
    branches: [main]

jobs:
  money-flows:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: salary_vault
          POSTGRES_PASSWORD: salary_vault_password
          POSTGRES_DB: xavault_financial_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U salary_vault -d xavault_financial_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      XAVAULT_FINANCIAL_TEST_DSN: host=localhost user=salary_vault password=salary_vault_password dbname=xavault_financial_test port=5432 sslmode=disable TimeZone=UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Reconciliation and money-flow integration tests
        run: go test -p 1 -tags=integration ./internal/alerts ./internal/reconciliation ./internal/wallets ./internal/withdrawals ./internal/webhooks ./internal/auth -v
      - name: Race detection for concurrent financial flows
        run: go test -race -p 1 -tags=integration ./internal/alerts ./internal/reconciliation ./internal/wallets ./internal/withdrawals ./internal/webhooks ./internal/auth
