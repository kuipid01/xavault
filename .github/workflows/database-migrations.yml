name: Database migrations

on:
  pull_request:
  push:
    branches: [main]

jobs:
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: salary_vault
          POSTGRES_PASSWORD: salary_vault_password
          POSTGRES_DB: xavault_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U salary_vault -d xavault_migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      XAVAULT_MIGRATION_TEST_DSN: host=localhost user=salary_vault password=salary_vault_password dbname=xavault_migration_test port=5432 sslmode=disable TimeZone=UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./internal/database -run 'TestVersionedMigrationsBuildFreshDatabase|TestGooseAdoptsLegacyAutoMigrateDatabase' -v
      - run: go test ./...
