name: Database backup and recovery

on:
  pull_request:
  push:
    branches: [main]

jobs:
  recovery-drill:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: salary_vault
          POSTGRES_PASSWORD: salary_vault_password
          POSTGRES_DB: xavault_source
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U salary_vault -d xavault_source"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: salary_vault_password
      DATABASE_URL: postgres://salary_vault:salary_vault_password@localhost:5432/xavault_source?sslmode=disable
      BACKUP_ENCRYPTION_KEY: ci-only-recovery-key-not-for-production
      BACKUP_DIR: ${{ github.workspace }}/tmp/recovery-backups
      RESTORE_DATABASE_URL: postgres://salary_vault:salary_vault_password@localhost:5432/xavault_restore_drill?sslmode=disable
      RESTORE_CONFIRMATION: isolated-drill
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: salary_vault
      DB_PASSWORD: salary_vault_password
      DB_NAME: xavault_source
      DB_SSLMODE: disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create source schema
        run: go run ./cmd/migrate up
      - name: Seed representative financial state
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO users(id,email,password,first_name,last_name,country,phone_number)
          VALUES ('11111111-1111-4111-8111-111111111111','restore@example.test','hash','Restore','Test','NG','08000000000');
          INSERT INTO wallets(id,user_id,available_balance,locked_balance,ledger_balance)
          VALUES ('22222222-2222-4222-8222-222222222222','11111111-1111-4111-8111-111111111111',1000,0,1000);
          INSERT INTO wallet_deposits(id,user_id,wallet_id,reference,amount,status)
          VALUES ('33333333-3333-4333-8333-333333333333','11111111-1111-4111-8111-111111111111','22222222-2222-4222-8222-222222222222','RESTORE-DEP-1',1000,'success');
          INSERT INTO wallet_ledgers(id,user_id,wallet_id,reference,type,source,source_id,amount,balance_before,balance_after)
          VALUES ('44444444-4444-4444-8444-444444444444','11111111-1111-4111-8111-111111111111','22222222-2222-4222-8222-222222222222','RESTORE-LEDGER-1','credit','deposit','33333333-3333-4333-8333-333333333333',1000,0,1000);
          SQL
      - name: Create encrypted backup
        id: backup
        run: echo "file=$(sh scripts/backup_database.sh)" >> "$GITHUB_OUTPUT"
      - name: Create isolated restore database
        run: createdb -h localhost -U salary_vault xavault_restore_drill
      - name: Restore and verify
        run: sh scripts/restore_drill.sh "${{ steps.backup.outputs.file }}"
      - name: Verify exact restored financial state
        run: |
          test "$(psql "$RESTORE_DATABASE_URL" -Atc "SELECT available_balance || ':' || locked_balance || ':' || ledger_balance FROM wallets WHERE id='22222222-2222-4222-8222-222222222222'")" = "1000:0:1000"
          test "$(psql "$RESTORE_DATABASE_URL" -Atc "SELECT count(*) FROM wallet_ledgers WHERE reference='RESTORE-LEDGER-1'")" = "1"
