services:
  postgres:
    image: postgres:16
    container_name: salary_vault_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: salary_vault
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: salary_vault
    ports:
      - "5432:5432"
    volumes:
      - salary_vault_pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: salary_vault_api
    restart: unless-stopped
    env_file:
    - .env
    environment:
      DB_HOST: postgres
      DB_USER: salary_vault
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: salary_vault
      BREVO_API_KEY: ${BREVO_API_KEY:?BREVO_API_KEY is required}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME:-xavault}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:?BREVO_SENDER_EMAIL is required}
      DB_PORT: 5432
      APP_PORT: 8080
      APP_ENV: "production"
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  salary_vault_pgdata:
