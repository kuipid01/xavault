services:
  postgres:
    image: postgres:16
    container_name: salary_vault_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: salary_vault
      POSTGRES_PASSWORD: salary_vault_password
      POSTGRES_DB: salary_vault
    ports:
      - "5432:5432"
    volumes:
      - salary_vault_pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: salary_vault_api
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_USER: salary_vault
      DB_PASSWORD: salary_vault_password
      DB_NAME: salary_vault
      BREVO_API_KEY: "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"
      BREVO_SENDER_NAME: "xavault"
      BREVO_SENDER_EMAIL: "xavault@kuipid.com"
      DB_PORT: 5432
      APP_PORT: 8080
      APP_ENV: "production"
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  salary_vault_pgdata: