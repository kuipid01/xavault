<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <title>Reset your withdrawal PIN</title>
</head>

<body style="margin:0; padding:0; font-family:Arial, sans-serif; background:#f6f6f6;">
    <table width="100%" cellpadding="0" cellspacing="0" style="padding:30px 0;">
        <tr>
            <td align="center">
                <table width="600" cellpadding="0" cellspacing="0"
                    style="background:#ffffff; border-radius:12px; padding:30px;">
                    <tr>
                        <td>
                            <h2 style="color:#111111;">Reset your withdrawal PIN</h2>

                            <p style="font-size:16px; color:#333333;">
                                Hi {{.Name}},
                            </p>

                            <p style="font-size:16px; color:#333333;">
                                Use this one-time code to reset the withdrawal PIN for your {{.AppName}} account.
                            </p>

                            <p style="font-size:32px; letter-spacing:8px; font-weight:bold; color:#0b5f3a; margin:30px 0;">
                                {{.OTP}}
                            </p>

                            <p style="font-size:14px; color:#666666;">
                                This code will expire in {{.ExpiryMinutes}} minutes.
                            </p>

                            <p style="font-size:14px; color:#666666;">
                                If you did not request this reset, you can safely ignore this email.
                            </p>

                            <hr style="border:none; border-top:1px solid #eeeeee; margin:30px 0;" />

                            <p style="font-size:12px; color:#999999;">
                                {{.AppName}}
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>

</html>
